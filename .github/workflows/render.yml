name: render

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (used when script is empty)"
        required: false
        default: ""
      script:
        description: "Full script (used as-is when not empty)"
        required: false
        default: ""
      style:
        description: "Style code"
        required: true
        default: "B2"
      voice:
        description: "Voice language"
        required: true
        default: "English"
      seconds:
        description: "Target length (20-90)"
        required: false
        default: "40"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  render:
    # issue path: only the owner; dispatch path: requires the Actions secret/token anyway
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.actor == 'Aanirudra78' && startsWith(github.event.issue.title, '[render]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: pipeline/package-lock.json

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core

      - name: Install dependencies
        run: npm ci --prefix pipeline

      - name: Build render request
        id: req
        env:
          IN_TOPIC: ${{ inputs.topic }}
          IN_SCRIPT: ${{ inputs.script }}
          IN_STYLE: ${{ inputs.style }}
          IN_VOICE: ${{ inputs.voice }}
          IN_SECONDS: ${{ inputs.seconds }}
        run: node .github/parse-request.mjs

      - name: Render video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ steps.req.outputs.topic }}
          SCRIPT: ${{ steps.req.outputs.script }}
          HINDI_FONT: /usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf
        run: |
          node pipeline/autovideo.mjs \
            --style "${{ steps.req.outputs.style }}" \
            --voice "${{ steps.req.outputs.voice }}" \
            --seconds "${{ steps.req.outputs.seconds }}"

      - name: Publish to website + manifest
        id: publish
        env:
          RENDER_STYLE: ${{ steps.req.outputs.style }}
          RENDER_VOICE: ${{ steps.req.outputs.voice }}
          RENDER_TOPIC: ${{ steps.req.outputs.topic }}
          RENDER_SCRIPT: ${{ steps.req.outputs.script }}
        run: |
          if [ -z "$RENDER_TOPIC" ]; then RENDER_TOPIC="$(echo "$RENDER_SCRIPT" | head -c 70)"; fi
          node .github/publish-render.mjs

      - name: Commit renders to the site
        run: |
          git config user.name "render-bot"
          git config user.email "Aanirudra78@users.noreply.github.com"
          git add renders
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "render: ${{ steps.req.outputs.style }} video"
          git push

      - name: Comment on the issue (issue requests only)
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} \
            --repo Aanirudra78/stickman-gallery \
            --body "✅ **Your video is ready!** $(cat render-comment.md)"
